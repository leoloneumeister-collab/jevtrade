[project]
name = "jevbot"
version = "0.1.0"
description = "Paper-trading market maker: Jev for judgment, code for everything else"
requires-python = ">=3.11"
dependencies = ["typesafe-sdk>=0.7.4", "websockets>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "polymarket-apis>=2.3", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
jevbot = "jevbot.cli:main"

[tool.setuptools]
packages = ["jevbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "S"]
ignore = ["E701", "E702", "E741", "S101", "S311", "SIM108"]   # one-line statements and asserts in tests are fine; random is for simulation only

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011", "E501"]
"jevbot/cli.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
files = ["jevbot"]
