# Polymarket overlay. Use: jevbot --config config.polymarket.toml run --feed polymarket ...
# Prices are probabilities (0..1), sizes are shares, money is USDC.

[jev]
model = "jev-1.13.0"
block_ms = 1000
deadline_ms = 800        # measured Jev latency from the cloud: median ~250ms, max ~300ms

[policy]
toxic_pull = 0.60
stress_widen = 0.70
quote_min_score = 2.0
quote_min_conf = 0.80
wide_min_score = 1.0
crisis_conf = 0.60
low_conf = 0.50
direction_min_conf = 0.75
direction_tilt_bps = 0.0
widen_mult = 3.0
wide_mult = 2.0
rules_max_spread_bps = 1500.0   # code-only fallback limits
rules_max_vol_ratio = 1.5
rules_flow_band = 0.2
rules_pressure_step = 12.0

[pricing]
gamma = 1.0
horizon_blocks = 100
base_half_spread_bps = 2.0
vol_spread_k = 0.5
min_half_spread_bps = 1.0
skew_bps = 20.0          # a 0.01 tick is ~200 bps at p=0.5, so skew in bigger steps
base_size = 5.0          # Polymarket's usual minimum order is 5 shares: CHECK min_order_size on the book
tick_size = 0.01         # overridden at runtime by the venue's own tick size

[risk]
max_position = 40.0      # shares
max_order_size = 10.0
max_daily_loss = 5.0     # USDC
max_drawdown = 8.0
max_hold_seconds = 900.0
max_data_age_ms = 15000.0   # quiet markets send nothing; age is measured from PONG/heartbeats too
max_leverage = 3.0
max_venue_errors = 5
max_decision_ms = 800.0

[paper]
capital = 100.0
maker_fee_bps = 0.0      # VERIFY per market via the venue's fee-rate endpoint; maker rebates not modelled
order_cost = 0.0         # orders are signed off-chain: no gas per place/cancel. VERIFY.
queue_factor = 0.5       # we do not know our queue position; half of each print reaches us
exit_slippage_bps = 150.0  # flattening crosses the spread

[run]
blocks = 3600
seed = 7
warmup_blocks = 120
order_ttl_blocks = 60
replace_bps = 50.0       # about a quarter tick: do not chase single-tick wiggles
journal = "runs/poly_journal.jsonl"
kill_file = "KILL"
vol_long_halflife_blocks = 20000
